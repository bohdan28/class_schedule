name: 'Build and Push to GAR'

on:
  push:
    branches:
    - 'main'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: 'deploy'
    steps:

    - name: code checkout
      uses: actions/checkout@v2

    - name: install the gcloud cli
      uses: google-github-actions/setup-gcloud@v0
      with:
        project_id: ${PROJECT_ID}
        service_account_key: ${{ secrets.CREDENTIALS_JSON }}
        export_default_credentials: true

    - name: build and push the docker image
      env:
        GOOGLE_PROJECT: ${{ secrets.GOOGLE_PROJECT }}
      run: |
        gcloud auth configure-docker us-central1-docker.pkg.dev
        docker build -t europe-central2-docker.pkg.dev/devops-internrship/class-schedule/backend:latest .
        docker push europe-central2-docker.pkg.dev/devops-internrship/class-schedule/backend:latest
