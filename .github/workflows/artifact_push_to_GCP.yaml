name: 'Build and Push to GAR'

on:
  push:
    branches:
    - 'main'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: 'deploy'
    steps:

    - name: code checkout
      uses: actions/checkout@v4

    - id: 'auth'
      uses: 'google-github-actions/auth@v2'
      with:
        credentials_json: '${{ secrets.CREDENTIALS_JSON }}'

    - name: build and push the docker image
      run: |
        gcloud auth configure-docker europe-central2-docker.pkg.dev
        docker build -t europe-central2-docker.pkg.dev/devops-internrship/class-schedule/backend:latest .
        docker push europe-central2-docker.pkg.dev/devops-internrship/class-schedule/backend:latest
